<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0E1A33"/>
<title>Venda Fácil</title>
<style>
  :root { --mar:#0E1A33; --mar2:#132544; --ouro:#C6A15B; --prata:#E7E2D8; --linha:#2A4068; }
  * { box-sizing:border-box; }
  body { margin:0; background:#081226; color:var(--prata); font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; }
  .tel { width:min(430px,100%); min-height:100vh; margin:0 auto; background:var(--mar); display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:10px; padding:18px 18px 8px; }
  header img { width:54px; height:54px; border-radius:12px; object-fit:cover; }
  header b { display:block; font-size:20px; letter-spacing:-.03em; }
  header span { color:#b7c0d0; font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
  main { padding:8px 18px 108px; flex:1; }
  h1 { font-size:30px; line-height:1.12; letter-spacing:-.04em; font-weight:560; margin:8px 0; }
  p { color:#b7c0d0; line-height:1.4; }
  button, input { font:inherit; font-size:16px; }
  .acao { min-height:50px; width:100%; border:0; border-radius:13px; background:var(--ouro); color:var(--mar); font-weight:700; }
  .fantasma { min-height:48px; width:100%; margin-top:8px; border:1px solid var(--linha); border-radius:13px; background:transparent; color:#b7c0d0; }
  .campo { display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
  .campo span { font-size:13px; color:#b7c0d0; }
  .campo input { min-height:48px; border:1px solid var(--linha); border-radius:12px; background:var(--mar2); color:var(--prata); padding:0 12px; }
  .card { background:var(--mar2); border:1px solid var(--linha); border-radius:16px; padding:4px 14px; }
  .peca { display:flex; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--linha); }
  .peca:last-child { border-bottom:0; }
  .foto { width:56px; height:56px; border-radius:12px; background:#1c335c; }
  .abas { position:sticky; bottom:0; display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--linha); background:var(--mar); }
  .abas button { min-height:56px; border:0; background:transparent; color:#b7c0d0; }
  .abas button.on { background:#17305C; color:var(--ouro); font-weight:700; }
  .aviso { background:#17305C; border-radius:14px; padding:12px 14px; margin:12px 0; }
</style>
</head>

    <div><b>Venda Fácil</b><span>Guia de revenda</span></div>
  </header>
  <main id="miolo"></main>
  <nav class="abas" id="abas"></nav>
</div>
<script>
const telas = {
  primeira: `<h1>Cadastrar a peça</h1><p>Nome, preço e foto. O código fica para depois.</p>
    <label class="campo"><span>Nome</span><input value="Colar Riviera" readonly></label>
    <label class="campo"><span>Preço de venda</span><input value="70" readonly></label>
    <button class="acao" onclick="ir('mandar')">Salvar peça</button>`,
  mandar: `<h1>Mandar no WhatsApp</h1><p>A cliente pediu o modelo. Manda esta peça.</p>
    <div class="card"><div class="peca"><div class="foto"></div><div><b>Colar Riviera</b><div>1 no estoque</div></div><div style="margin-left:auto;font-weight:700">R$ 70</div></div></div>
    <button class="acao" onclick="ir('inicio')">Mandar no WhatsApp</button>`,
  inicio: `<h1>Pôr foto nas peças</h1><p>Uma coisa de cada vez.</p>
    <button class="acao" onclick="ir('pecas')">Pôr foto nas peças</button>
    <div class="aviso"><b>1 para cobrar</b><div>R$ 70 na confiança.</div></div>`,
  pecas: `<h1>Peças</h1><p>2 à venda.</p>
    <div class="card">
      <div class="peca"><div class="foto"></div><div><b>Colar Riviera</b><div>1 no estoque</div></div><div style="margin-left:auto">R$ 70</div></div>
      <div class="peca"><div class="foto"></div><div><b>Argola média</b><div>Sem foto</div></div><div style="margin-left:auto">R$ 45</div></div>
    </div>`,
  vender: `<h1>Vender</h1><p>A peça sai do estoque sozinha.</p>
    <label class="campo"><span>Peça</span><input value="Colar Riviera · R$ 70" readonly></label>
    <label class="campo"><span>Quem comprou</span><input placeholder="Nome da cliente"></label>
    <label class="campo"><span>Como pagou</span><input value="Na confiança" readonly></label>
    <button class="acao">Registrar venda</button>`,
  loja: `<h1>Loja</h1><p>O link inteiro, depois da peça.</p>
    <button class="acao">Enviar no WhatsApp</button>
    <button class="fantasma">Copiar link</button>`
};
let atual = "primeira";
function ir(id){ atual = id; desenhar(); }
function desenhar(){
  document.getElementById("miolo").innerHTML = telas[atual];
  const portas = [["inicio","Início"],["pecas","Peças"],["vender","Vender"],["loja","Loja"]];
  document.getElementById("abas").innerHTML = (atual==="primeira"||atual==="mandar") ? "" : portas.map(([id,n])=>`<button class="${atual===id?"on":""}" onclick="ir('${id}')">${n}</button>`).join("");
}
desenhar();
</script>
</body>
</html>
