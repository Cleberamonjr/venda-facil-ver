<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0E1A33"/>
<title>Venda Fácil</title>
<style>
  :root { --mar:#0E1A33; --mar2:#132544; --ouro:#C6A15B; --prata:#F4F1EA; --mudo:#b7c0d0; --linha:#2A4068; }
  * { box-sizing:border-box; }
  body { margin:0; background:#081226; color:var(--prata); font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; }
  button, input, textarea, select { font:inherit; font-size:16px; }
  .tel { width:min(430px,100%); min-height:100vh; margin:0 auto; background:var(--mar); display:flex; flex-direction:column; }
  header { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:16px 16px 6px; }
  .marca { display:flex; align-items:center; gap:10px; }
  header img { width:48px; height:48px; border-radius:12px; object-fit:cover; }
  header b { display:block; letter-spacing:-.03em; }
  header span, .mudo { color:var(--mudo); font-size:13px; }
  main { padding:8px 16px 118px; flex:1; }
  h1 { font-size:28px; line-height:1.12; letter-spacing:-.04em; font-weight:560; margin:8px 0; }
  .acao, .fantasma { min-height:48px; width:100%; border-radius:13px; }
  .acao { border:0; background:var(--ouro); color:var(--mar); font-weight:700; }
  .fantasma { margin-top:8px; border:1px solid var(--linha); background:transparent; color:var(--mudo); }
  .sair { width:auto; min-height:40px; padding:0 12px; margin:0; }
  .campo { display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
  .campo span { font-size:13px; color:var(--mudo); }
  .campo input, .campo textarea, .campo select { min-height:48px; border:1px solid var(--linha); border-radius:12px; background:var(--mar2); color:var(--prata); padding:10px 12px; }
  .card { background:var(--mar2); border:1px solid var(--linha); border-radius:16px; padding:12px; margin-bottom:10px; }
  .grade { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .peca-card img, .foto-vazia { width:100%; height:150px; object-fit:cover; border-radius:12px; background:#1c335c; }
  .precos { display:flex; justify-content:space-between; gap:8px; margin-top:8px; font-size:13px; }
  .ouro { color:var(--ouro); font-weight:700; }
  .aviso { background:#17305C; border-radius:14px; padding:12px; margin:10px 0; }
  .abas { position:sticky; bottom:0; display:grid; grid-template-columns:repeat(5,1fr); border-top:1px solid var(--linha); background:var(--mar); padding-bottom:env(safe-area-inset-bottom); }
  .abas button { min-height:54px; border:0; background:transparent; color:var(--mudo); font-size:12px; }
  .abas button.on { background:#17305C; color:var(--ouro); font-weight:700; }
  .qtd { display:flex; align-items:center; gap:8px; }
  .qtd button { width:36px; height:36px; border-radius:10px; border:1px solid var(--linha); background:transparent; color:var(--prata); }
</style>
</head>
<body>
<div class="tel">
  <header>
    <div class="marca"><img src="logo-venda-facil.jpg" alt="Venda Fácil"/><div><b>Venda Fácil</b><span id="loja-nome">Guia de revenda</span></div></div>
    <button class="fantasma sair" id="btn-sair" hidden>Sair</button>
  </header>
  <main id="miolo"></main>
  <nav class="abas" id="abas"></nav>
</div>
<script>
const chave = "vf-casa";
const zero = () => ({ conta:null, pecas:[], pedidos:[], sessao:false });
let e = JSON.parse(localStorage.getItem(chave) || "null") || zero();
let tela = "login";
let rascunho = { nome:"", descricao:"", custo:"", venda:"", foto:"", qtd:1 };
let carrinho = {};
const cliente = new URLSearchParams(location.search).get("loja") === "1";
const brl = (n) => Number(n||0).toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
const salvar = () => { localStorage.setItem(chave, JSON.stringify(e)); desenhar(); };
function fotoArquivo(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  const leitor = new FileReader();
  leitor.onload = () => { rascunho.foto = leitor.result; desenhar(); };
  leitor.readAsDataURL(f);
}
function entrar(ev) {
  ev.preventDefault();
  const fd = new FormData(ev.target);
  e.conta = { email: fd.get("email"), nome: fd.get("nome") || "Minha loja", pix: fd.get("pix") || "" };
  e.sessao = true;
  tela = "inicio";
  salvar();
}
function cadastrarPeca(ev) {
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const custo = Number(String(fd.get("custo")).replace(",","."));
  const venda = Number(String(fd.get("venda")).replace(",","."));
  if (!fd.get("nome") || !venda) return;
  e.pecas.push({ id: Date.now(), nome: fd.get("nome"), descricao: fd.get("descricao") || "", custo, venda, qtd: Number(fd.get("qtd")||1), foto: rascunho.foto });
  rascunho = { nome:"", descricao:"", custo:"", venda:"", foto:"", qtd:1 };
  tela = "pecas";
  salvar();
}
function fazerPedido() {
  const itens = e.pecas.filter(p => carrinho[p.id]).map(p => ({ ...p, qtdPedido: carrinho[p.id] }));
  if (!itens.length) return;
  e.pedidos.unshift({ id: Date.now(), cliente: "Cliente do link", itens, total: itens.reduce((s,p)=>s+p.venda*p.qtdPedido,0), pago: false });
  carrinho = {};
  tela = cliente ? "obrigada" : "pedidos";
  salvar();
}
function pago(id, valor) {
  e.pedidos = e.pedidos.map(p => p.id === id ? { ...p, pago: valor } : p);
  salvar();
}
function desenhar() {
  document.getElementById("loja-nome").textContent = e.conta?.nome || "Guia de revenda";
  document.getElementById("btn-sair").hidden = cliente || !e.sessao;
  const miolo = document.getElementById("miolo");
  if (cliente) miolo.innerHTML = vistaCliente();
  else if (!e.sessao) miolo.innerHTML = login();
  else miolo.innerHTML = ({ inicio, pecas, catalogo, pedidos, painel }[tela] || inicio)();
  const portas = [["inicio","Início"],["pecas","Peças"],["catalogo","Catálogo"],["pedidos","Pedidos"],["painel","Painel"]];
  document.getElementById("abas").innerHTML = (!e.sessao || cliente) ? "" : portas.map(([id,n]) => `<button class="${tela===id?"on":""}" data-t="${id}">${n}</button>`).join("");
  ligar();
}
function login() {
  return `<h1>Entrar</h1><p class="mudo">Sua loja, no WhatsApp.</p>
    <form id="form-login">
      <label class="campo"><span>Seu nome ou da loja</span><input name="nome" placeholder="Ana Semijoias" required></label>
      <label class="campo"><span>E-mail</span><input name="email" type="email" placeholder="voce@email.com" required></label>
      <label class="campo"><span>Senha</span><input name="senha" type="password" required></label>
      <label class="campo"><span>Chave Pix, se quiser adiantar a venda</span><input name="pix" placeholder="Pode deixar em branco"></label>
      <button class="acao">Entrar</button>
    </form>`;
}
function inicio() {
  return `<h1>Cadastrar a peça</h1><p class="mudo">Quanto pagou, por quanto vende, foto e uma frase.</p>${formPeca()}`;
}
function formPeca() {
  return `<form id="form-peca">
    <label class="campo"><span>Nome</span><input name="nome" placeholder="Colar Riviera" required></label>
    <label class="campo"><span>Descrição</span><textarea name="descricao" rows="2" placeholder="O que a cliente precisa saber"></textarea></label>
    <label class="campo"><span>Quanto pagou</span><input name="custo" inputmode="decimal" placeholder="28" required></label>
    <label class="campo"><span>Por quanto vai vender</span><input name="venda" inputmode="decimal" placeholder="70" required></label>
    <label class="campo"><span>Quantidade</span><input name="qtd" inputmode="numeric" value="1"></label>
    <label class="campo"><span>Foto</span><input name="foto" type="file" accept="image/*" id="foto"></label>
    ${rascunho.foto ? `<img src="${rascunho.foto}" alt="" style="width:100%;height:180px;object-fit:cover;border-radius:12px;margin-bottom:12px"/>` : ""}
    <button class="acao">Salvar peça</button>
  </form>`;
}
function pecas() {
  if (!e.pecas.length) return `<h1>Peças</h1><p class="mudo">Nenhuma ainda.</p><button class="acao" data-t="inicio">Cadastrar a primeira</button>`;
  return `<h1>Peças</h1><div class="grade">${e.pecas.map(card).join("")}</div>`;
}
function card(p) {
  const lucro = (p.venda - p.custo) * p.qtd;
  return `<article class="card"><img src="${p.foto || ""}" alt="" class="${p.foto?"":"foto-vazia"}"/><b>${p.nome}</b><div class="mudo">${p.descricao || ""}</div><div class="precos"><span>Pagou ${brl(p.custo)}</span><span class="ouro">${brl(p.venda)}</span></div><div class="mudo">Lucro ${brl(lucro)}</div></article>`;
}
function catalogo() {
  const link = location.origin + location.pathname + "?loja=1";
  return `<h1>Catálogo</h1><p class="mudo">A cliente abre o link, vê a foto e escolhe a quantidade.</p>
    <a class="acao" style="display:grid;place-items:center;text-decoration:none" href="https://wa.me/?text=${encodeURIComponent("Olha meu catálogo: " + link)}">Mandar no WhatsApp</a>
    <p class="mudo">Link da cliente: ${link}</p>${e.pecas.map(p => `<article class="card"><img src="${p.foto||""}" style="height:220px;object-fit:cover;width:100%;border-radius:12px;background:#1c335c"/><b>${p.nome}</b><div>${p.descricao||""}</div><div class="ouro">${brl(p.venda)}</div></article>`).join("")}`;
}
function pedidos() {
  if (!e.pedidos.length) return `<h1>Pedidos</h1><p class="mudo">Quando a cliente escolher, o pedido cai aqui.</p>`;
  return `<h1>Pedidos</h1>${e.pedidos.map(p => `<article class="card"><b>${p.cliente}</b><div class="ouro">${brl(p.total)}</div><div class="mudo">${p.pago ? "Pago" : "Não pago"}</div><button class="acao" data-pago="${p.id}" data-valor="${p.pago?0:1}">${p.pago ? "Marcar não pago" : "Marcar pago"}</button></article>`).join("")}`;
}
function painel() {
  const investido = e.pecas.reduce((s,p)=>s+p.custo*p.qtd,0);
  const aVenda = e.pecas.reduce((s,p)=>s+p.venda*p.qtd,0);
  const aberto = e.pedidos.filter(p=>!p.pago).reduce((s,p)=>s+p.total,0);
  return `<h1>Painel</h1><div class="aviso"><b>${brl(investido)}</b><div>Você pagou nas peças</div></div><div class="aviso"><b class="ouro">${brl(aVenda)}</b><div>Se vender tudo</div></div><div class="aviso"><b>${brl(aVenda-investido)}</b><div>Lucro previsto</div></div><div class="aviso"><b>${brl(aberto)}</b><div>Pedidos não pagos</div></div><div class="grade">${e.pecas.map(card).join("")}</div>`;
}
function vistaCliente() {
  if (tela === "obrigada") return `<h1>Pedido enviado</h1><p class="mudo">Ela marca pago quando o Pix cair.${e.conta?.pix ? " Chave: " + e.conta.pix : ""}</p>`;
  return `<h1>${e.conta?.nome || "Catálogo"}</h1><p class="mudo">${e.conta?.pix ? "Pix: " + e.conta.pix : "Escolhe e manda o pedido."}</p>
    ${e.pecas.map(p => `<article class="card"><img src="${p.foto||""}" style="width:100%;height:240px;object-fit:cover;border-radius:12px;background:#1c335c"/><b>${p.nome}</b><div>${p.descricao||""}</div><div class="ouro">${brl(p.venda)}</div>
      <div class="qtd"><button data-menos="${p.id}">−</button><b>${carrinho[p.id]||0}</b><button data-mais="${p.id}">+</button></div></article>`).join("")}
    <button class="acao" id="pedir">Enviar pedido</button>
    ${(e.pedidos||[]).map(p => `<article class="card"><b>Seu pedido</b><div>${brl(p.total)} · ${p.pago?"Pago":"Não pago"}</div><button class="fantasma" data-pago="${p.id}" data-valor="${p.pago?0:1}">${p.pago?"Marcar não pago":"Já paguei"}</button></article>`).join("")}`;
}
function ligar() {
  document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { tela = b.dataset.t; desenhar(); });
  const loginForm = document.getElementById("form-login");
  if (loginForm) loginForm.onsubmit = entrar;
  const pecaForm = document.getElementById("form-peca");
  if (pecaForm) pecaForm.onsubmit = cadastrarPeca;
  const foto = document.getElementById("foto");
  if (foto) foto.onchange = () => fotoArquivo(foto);
  document.getElementById("btn-sair").onclick = () => { e.sessao = false; tela = "login"; salvar(); };
  document.querySelectorAll("[data-mais]").forEach(b => b.onclick = () => { carrinho[b.dataset.mais] = (carrinho[b.dataset.mais]||0)+1; desenhar(); });
  document.querySelectorAll("[data-menos]").forEach(b => b.onclick = () => { carrinho[b.dataset.menos] = Math.max(0,(carrinho[b.dataset.menos]||0)-1); desenhar(); });
  const pedir = document.getElementById("pedir");
  if (pedir) pedir.onclick = fazerPedido;
  document.querySelectorAll("[data-pago]").forEach(b => b.onclick = () => pago(Number(b.dataset.pago), b.dataset.valor === "1"));
}
desenhar();
</script>
</body>
</html>
